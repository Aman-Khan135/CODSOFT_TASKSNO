<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="task3.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
        </header>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="card balance-card">
                <h3>Total Balance</h3>
                <h2 id="balance">$0.00</h2>
            </div>
            <div class="card income-card">
                <h3>Income</h3>
                <h2 id="income-total">+$0.00</h2>
            </div>
            <div class="card expense-card">
                <h3>Expense</h3>
                <h2 id="expense-total">-$0.00</h2>
            </div>
        </div>

        <div class="main-content">
            <!-- Add/Edit Transaction Form -->
            <div class="form-section">
                <h3 id="form-title">Add New Transaction</h3>
                <form id="transaction-form">
                    <div class="form-control">
                        <label for="type">Type</label>
                        <select id="type" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    
                    <div class="form-control">
                        <label for="desc">Description</label>
                        <input type="text" id="desc" placeholder="e.g., Groceries, Salary" required>
                    </div>

                    <div class="form-control">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                    </div>

                    <div class="form-control">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food & Dining</option>
                            <option value="Transport">Transportation</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-control">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <button type="submit" id="submit-btn" class="btn">Add Transaction</button>
                </form>
            </div>

            <!-- Transaction History -->
            <div class="history-section">
                <div class="history-header">
                    <h3>Transaction History</h3>
                    <div class="filter-control">
                        <label for="filter-category">Filter:</label>
                        <select id="filter-category">
                            <option value="All">All Categories</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food & Dining</option>
                            <option value="Transport">Transportation</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <ul id="transaction-list" class="transaction-list">
                    <!-- Transactions will be injected here via JS -->
                </ul>
            </div>
        </div>
    </div>

    <script src="Task3.js"></script>
</body>
</html>
